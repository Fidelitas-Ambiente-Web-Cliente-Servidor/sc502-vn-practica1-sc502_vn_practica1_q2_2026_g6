<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Contacto | NextCode</title>

    <link rel="stylesheet" href="./css/contacto.css">
</head>
<body>
    <nav>
        <img src="./img/nextcode.png" class="logo">
        <div class="menu">
            <button onclick="location.href='./index.html'">Inicio</button>
            <button onclick="location.href='./cursos.html'">Cursos</button>
            <button onclick="location.href='./profesores.html'">Profesores</button>
        </div>
    </nav>
    <div class="inicio">
        <h1>Contáctanos</h1>
        <p>
            Estamos listos para ayudarte a iniciar
            tu carrera en programación.
        </p>
    </div>
    <div class="contacto">
        <div class="card">
            <h2>Formulario</h2>
            <form>
                <input type="text" placeholder="Nombre">
                <input type="email" placeholder="Correo">
                <input type="text" placeholder="Asunto">
                <textarea placeholder="Mensaje"></textarea>
                <button type="submit">
                    Enviar
                </button>
            </form>
        </div>
        <div class="card">
            <h2>Información</h2>
            <p>📍 San José, Costa Rica</p>
            <p>📞 +506 2222-1234</p>
            <p>📧 contacto@nextcode.com</p>
            <iframe
                src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3929.746520777404!2d-84.09072492585753!3d9.93254237422486!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x8fa0e3420b1b4d61%3A0x7c4d4ec2d5b4df44!2sSan%20Jos%C3%A9%2C%20Costa%20Rica!5e0!3m2!1ses!2scr!4v1717272000000!5m2!1ses!2scr"
                loading="lazy">
            </iframe>

        </div>
    </div>
    <footer>
        <p>
            © 2026 NextCode Academy
        </p>
    </footer>
</body>
</html>
