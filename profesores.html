
<!DOCTYPE html>
<html lang="es">

<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="./css/index.css">
    <link rel="stylesheet" href="./css/profesores.css">
</head>

<body>

<nav>
    

        <img src="./img/nextcode.png" class="logo">

        <div class="menu">
            <button id="btnInicio">
                Inicio
            </button>

            <button id="btnContacto">
                Contacto
            </button>

            <button id="btnCursos">
                Cursos
            </button>
        </div>

    
</nav>

<header>

    <h1>Profesores</h1>

    <p>
        Conoce a nuestros profesores expertos en programación.
    </p>

</header>

<div class="container">

    <div
        id="contenedor-profesores"
        class="row justify-content-center g-4">
    </div>

</div>


<section class="container my-5">

<div class="row g-4">

<div class="col-md-6">

<div class="caja-texto">

<h2>Nuestra Misión</h2>

<p>
Formar profesionales de excelencia...
</p>

</div>

</div>

<div class="col-md-6">

<div class="caja-texto">

<h2>Nuestra Visión</h2>

<p>
Ser la academia de programación líder...
</p>

</div>

</div>

</div>

</section>


<footer class="text-center py-3">

<p>© 2026 NextCode Academy</p>

</footer>


<div
class="modal fade"
id="modalProfesor"
tabindex="-1">

<div class="modal-dialog">

<div class="modal-content">

<div class="modal-header">

<h5
id="modal-nombre"
class="modal-title">
</h5>

<button
type="button"
class="btn-close"
data-bs-dismiss="modal">
</button>

</div>


<div class="modal-body text-center">

<img
id="modal-img"
class="foto-modal"
src=""
alt="">

<h6 id="modal-especialidad"></h6>

<p id="modal-descripcion"></p>

<hr>

<p>

<strong>Correo:</strong>

<span id="modal-correo"></span>

</p>

<p>

<strong>Cursos:</strong>

<span id="modal-cursos"></span>

</p>

</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="./js/profesores.js"></script>
